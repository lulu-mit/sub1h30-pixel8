name: Build Android APK (Pixel 8)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Sub-1h30 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Isolated Capacitor Project & Generate Android App
        run: |
          mkdir -p apk-build
          cp -r mobile-pwa apk-build/mobile-pwa
          cp capacitor.config.json apk-build/capacitor.config.json
          cd apk-build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Build Android APK (Gradle AssembleDebug)
        working-directory: apk-build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Sub1h30-Lubin-Pixel8.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sub1h30-Lubin-Pixel8-APK
          path: Sub1h30-Lubin-Pixel8.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Sub-1h30 Lubin (Pixel 8) — APK v1.0.${{ github.run_number }}"
          body: |
            ### 📱 Téléchargement Direct APK Android (Google Pixel 8)
            Appuie directement depuis ton **Google Pixel 8** sur le fichier **`Sub1h30-Lubin-Pixel8.apk`** ci-dessous (dans la section **Assets**) pour télécharger et installer l'application.

            #### Inclus dans cette version :
            - **Synchronisation Temps Réel** : Garmin / Intervals.icu (`i778652`) + Google Docs (*Projet Sub-1h30* & *Journal d'entraînement*)
            - **5 Pages Complètes** :
              1. `Accueil` : Countdown 10k Montmartre / Semi de Paris, Prochaine séance, Trajectoire Sub-1h30 & Santé Garmin FR 255
              2. `Phases` : Macrocycle 22 semaines (5 phases, détection automatique de la Phase 2 actuelle, avancement & semaines types)
              3. `Séances` : Semaine type Phase 2 (note Concert GIMS 3 nov.) & Historique synchronisé
              4. `Chaussures` : Nike Vomero 18 (387 km), Saucony Endorphin Speed 5 (170 km), Hoka Speedgoat 6 & date estimée de fin de vie
              5. `Course` : Stratégie d'allure `< 4'15"/km` & protocole ravitaillement Semi de Paris
          files: Sub1h30-Lubin-Pixel8.apk
          draft: false
          prerelease: false
          make_latest: "true"
